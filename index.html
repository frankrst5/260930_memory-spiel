<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji-Memory</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --card-back: #3b6ea5;
      --card-back-hover: #4a7fb8;
      --card-front: #ffffff;
      --matched: #d8efd9;
      --accent: #3b6ea5;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1d21;
        --text: #ececec;
        --muted: #a0a0a0;
        --card-back: #4a7fb8;
        --card-back-hover: #5b90c9;
        --card-front: #2c2e34;
        --matched: #2f4a33;
        --accent: #7fb0e3;
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 { margin: 0 0 8px; font-size: 2rem; }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .stats strong { color: var(--text); }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 440px;
    }

    .card {
      aspect-ratio: 1;
      border: none;
      border-radius: 12px;
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      cursor: pointer;
      background: var(--card-back);
      box-shadow: var(--shadow);
      transition: transform 0.25s, background 0.2s;
      color: transparent;
    }
    .card:hover:not(.open):not(.matched) { background: var(--card-back-hover); }
    .card.open,
    .card.matched {
      background: var(--card-front);
      color: inherit;
      transform: rotateY(180deg) scaleX(-1);
      cursor: default;
    }
    .card.matched { background: var(--matched); }

    button.restart {
      margin-top: 20px;
      padding: 10px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.restart:hover { opacity: 0.9; }

    .message {
      min-height: 1.5em;
      margin-top: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🧠 Emoji-Memory</h1>

  <div class="stats">
    <span>Züge: <strong id="moves">0</strong></span>
    <span>Zeit: <strong id="time">0:00</strong></span>
  </div>

  <div class="board" id="board"></div>

  <p class="message" id="message"></p>
  <button class="restart" id="restart">Neues Spiel</button>

  <script>
    const EMOJIS = ["🐶", "🐱", "🦊", "🐼", "🐸", "🦁", "🐙", "🦄"];

    const board = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");

    let firstCard = null;
    let locked = false;
    let moves = 0;
    let matchedPairs = 0;
    let seconds = 0;
    let timer = null;

    // Fisher-Yates: mischt die Karten zufällig
    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(s) {
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function startTimer() {
      if (timer) return;
      timer = setInterval(() => {
        seconds++;
        timeEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function newGame() {
      stopTimer();
      firstCard = null;
      locked = false;
      moves = 0;
      matchedPairs = 0;
      seconds = 0;
      movesEl.textContent = "0";
      timeEl.textContent = "0:00";
      messageEl.textContent = "";
      board.innerHTML = "";

      for (const emoji of shuffle([...EMOJIS, ...EMOJIS])) {
        const card = document.createElement("button");
        card.className = "card";
        card.textContent = emoji;
        card.dataset.emoji = emoji;
        card.setAttribute("aria-label", "Verdeckte Karte");
        card.addEventListener("click", () => flip(card));
        board.appendChild(card);
      }
    }

    function flip(card) {
      if (locked || card === firstCard || card.classList.contains("matched")) return;

      startTimer();
      card.classList.add("open");
      card.setAttribute("aria-label", card.dataset.emoji);

      if (!firstCard) {
        firstCard = card;
        return;
      }

      moves++;
      movesEl.textContent = moves;

      if (firstCard.dataset.emoji === card.dataset.emoji) {
        firstCard.classList.add("matched");
        card.classList.add("matched");
        firstCard = null;
        matchedPairs++;
        if (matchedPairs === EMOJIS.length) {
          stopTimer();
          messageEl.textContent =
            `🎉 Geschafft in ${moves} Zügen und ${formatTime(seconds)} Minuten!`;
        }
      } else {
        // Kein Paar: kurz zeigen, dann wieder umdrehen
        locked = true;
        const previous = firstCard;
        firstCard = null;
        setTimeout(() => {
          previous.classList.remove("open");
          card.classList.remove("open");
          previous.setAttribute("aria-label", "Verdeckte Karte");
          card.setAttribute("aria-label", "Verdeckte Karte");
          locked = false;
        }, 800);
      }
    }

    document.getElementById("restart").addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
